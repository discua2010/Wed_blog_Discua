    <script>
      const video = document.getElementById('miVideo');
      
      const esMovil = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      if (esMovil) {
          video.src = "video/video2.mp4";
      } else {
          video.src = "video/video.mp4";
      }

      document.addEventListener('click', () => {
        video.muted = false;
      }, { once: true });
    </script>
