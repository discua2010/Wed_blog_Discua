<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Blog Discua</title>
    <link rel="stylesheet" href="controlador.css"/>
</head>
<body>
    <div id="detras">

        <video id="miVideo" autoplay loop muted playsinline></video>

        <div id="ensima">
            <h1>Blog Discua</h1>
            <h2>Todos los videos</h2>
            <hr>
            <p>Muchos de estos no tendran sonido porque o son videos sin editar como salieron o por temas de derechos de autor.</p>    
            <br>
            <p>El primero que se hizo:</p>
            <video src="videos de animaciones/0001-4704.mp4" controls width="100%">
                Tu navegador no soporta el formato de video.
            </video>
            <br>
            <video src="videos de animaciones/0001-0900.mp4" controls width="100%">
                Tu navegador no soporta el formato de video.
            </video>
            <br>
            <hr>
            <h2>Mas cositas</h2>
            <a href="index.html">Regresar</a>
            
        </div>
        
    </div>

    <script>
      const video = document.getElementById('miVideo');
      
      const esMovil = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      if (esMovil) {
          video.src = "video/video2.mp4";
      } else {
          video.src = "video/video.mp4";
      }

      document.addEventListener('click', () => {
        video.muted = false;
      }, { once: true });
    </script>
</body>
</html>
